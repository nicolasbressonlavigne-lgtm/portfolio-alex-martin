    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
