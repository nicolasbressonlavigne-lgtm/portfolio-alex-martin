      <stop offset="0" stop-color="#040912"/>
      <stop offset=".55" stop-color="#0a1a29"/>
      <stop offset="1" stop-color="#123040"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d303c"/>
      <stop offset="1" stop-color="#070f17"/>
    </linearGradient>
    <linearGradient id="aisle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243945"/>
      <stop offset="1" stop-color="#0c171f"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557285"/>
      <stop offset=".45" stop-color="#2c4555"/>
      <stop offset="1" stop-color="#13212b"/>
