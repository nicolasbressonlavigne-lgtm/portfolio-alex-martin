      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="boxKraft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6a15f"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9713b"/>
      <stop offset="1" stop-color="#6b421f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
