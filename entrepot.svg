<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titre desc">
  <title id="titre">Entrepôt logistique fictif</title>
  <desc id="desc">Un opérateur en gilet de sécurité circule sur un transpalette auto-roulant dans une allée d'entrepôt bordée de racks de stockage.</desc>

  <defs>
